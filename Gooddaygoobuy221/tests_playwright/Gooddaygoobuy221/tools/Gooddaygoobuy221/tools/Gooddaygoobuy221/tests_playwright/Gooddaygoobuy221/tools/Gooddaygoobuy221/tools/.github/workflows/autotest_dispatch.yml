name: AutoTest - Dispatch

on:
  workflow_dispatch:

jobs:
  run-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps

      - name: Run test
        env:
          AUTOTEST_TARGET: ${{ secrets.AUTOTEST_TARGET }}
          AUTOTEST_USER: ${{ secrets.AUTOTEST_USER }}
          AUTOTEST_PASS: ${{ secrets.AUTOTEST_PASS }}
        run: |
          mkdir -p Gooddaygoobuy221/artifacts
          python3 Gooddaygoobuy221/tests_playwright/register_autodesk.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autotest-artifacts
          path: Gooddaygoobuy221/artifacts
