
name: GooddayGoodbay220 TEMP REAL WINDOWS TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  real-windows:

    runs-on: windows-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find GooddayGoodbay220 ZIP and EXE
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root\evidence" |
            Out-Null

          $zips = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "GooddayGoodbay220.zip"

          if ($zips.Count -eq 0) {
            throw "GooddayGoodbay220.zip not found."
          }

          $zip = $zips[0].FullName

          Copy-Item `
            $zip `
            "$root\evidence\GooddayGoodbay220.zip"

          $zipHash = Get-FileHash `
            $zip `
            -Algorithm SHA256

          $zipHash |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\zip-sha256.json"

          $extract = "$root\extracted"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extract |
            Out-Null

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $extract `
            -Force

          $exes = Get-ChildItem `
            $extract `
            -Recurse `
            -File `
            -Filter "GooddayGoodbay220.exe"

          if ($exes.Count -eq 0) {
            throw "GooddayGoodbay220.exe not found."
          }

          $exe = $exes[0].FullName

          "EXE=$exe" |
            Out-File `
              "$root\evidence\exe.txt"

          $hash = Get-FileHash `
            $exe `
            -Algorithm SHA256

          $item = Get-Item $exe

          $bytes = [System.IO.File]::ReadAllBytes($exe)

          $mz = $false

          if ($bytes.Length -ge 2) {
            if (
              $bytes[0] -eq 0x4D -and
              $bytes[1] -eq 0x5A
            ) {
              $mz = $true
            }
          }

          [ordered]@{
            path = $exe
            size = $item.Length
            sha256 = $hash.Hash
            mz = $mz
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\exe-integrity.json"

          if (-not $mz) {
            throw "Invalid PE/MZ executable."
          }

      - name: Windows environment evidence
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          systeminfo |
            Out-File `
              "$root\evidence\systeminfo.txt"

          Get-ComputerInfo |
            Out-File `
              "$root\evidence\computerinfo.txt"

          Get-Process |
            Sort-Object ProcessName |
            Out-File `
              "$root\evidence\process-before.txt"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object `
              Caption,
              Version,
              BuildNumber,
              OSArchitecture |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\windows.json"

      - name: Windows executable metadata
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $exe = (
            Get-Content `
              "$root\evidence\exe.txt"
          ).Substring(4)

          $i = Get-Item $exe

          [ordered]@{
            ProductName = $i.VersionInfo.ProductName
            ProductVersion = $i.VersionInfo.ProductVersion
            FileDescription = $i.VersionInfo.FileDescription
            CompanyName = $i.VersionInfo.CompanyName
            OriginalFilename = $i.VersionInfo.OriginalFilename
            FileVersion = $i.VersionInfo.FileVersion
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\metadata.json"

          $sig = Get-AuthenticodeSignature $exe

          [ordered]@{
            Status = "$($sig.Status)"
            StatusMessage = "$($sig.StatusMessage)"
            Subject = if ($sig.SignerCertificate) {
              "$($sig.SignerCertificate.Subject)"
            } else {
              $null
            }
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\authenticode.json"

      - name: Detect installer or portable
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $exe = (
            Get-Content `
              "$root\evidence\exe.txt"
          ).Substring(4)

          $bytes = `
            [System.IO.File]::ReadAllBytes($exe)

          $text = `
            [System.Text.Encoding]::ASCII.GetString($bytes)

          $frameworks = @()

          if (
            $text.Contains("Nullsoft") -or
            $text.Contains("NSIS")
          ) {
            $frameworks += "NSIS"
          }

          if (
            $text.Contains("Inno Setup") -or
            $text.Contains("InnoSetup")
          ) {
            $frameworks += "INNO_SETUP"
          }

          if ($text.Contains("InstallShield")) {
            $frameworks += "INSTALLSHIELD"
          }

          if ($text.Contains("Squirrel")) {
            $frameworks += "SQUIRREL"
          }

          $i = Get-Item $exe

          $meta = @(
            $i.VersionInfo.ProductName
            $i.VersionInfo.FileDescription
            $i.VersionInfo.OriginalFilename
          ) -join " "

          $installer = $false

          if ($frameworks.Count -gt 0) {
            $installer = $true
          }

          if (
            $meta -match `
            "(?i)setup|installer|install|uninstall"
          ) {
            $installer = $true
          }

          [ordered]@{
            installer_candidate = $installer
            type = if ($installer) {
              "INSTALLER"
            } else {
              "PORTABLE_OR_UNKNOWN"
            }
            frameworks = @($frameworks | Select-Object -Unique)
            metadata = $meta
          } |
            ConvertTo-Json -Depth 10 |
            Out-File `
              "$root\evidence\installer-detection.json"

      - name: Capture pre-state
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $paths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $entries = @()

          foreach ($path in $paths) {

            $entries += Get-ItemProperty `
              $path `
              -ErrorAction SilentlyContinue |
              Select-Object `
                DisplayName,
                DisplayVersion,
                InstallLocation,
                UninstallString,
                QuietUninstallString
          }

          $shortcuts = @(
            Get-ChildItem `
              "$env:USERPROFILE\Desktop" `
              -ErrorAction SilentlyContinue |
              Select-Object FullName,Name
          )

          [ordered]@{
            uninstall_registry = @($entries)
            desktop = @($shortcuts)
          } |
            ConvertTo-Json -Depth 20 |
            Out-File `
              "$root\evidence\pre-state.json"

      - name: Real portable runtime test
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -eq "INSTALLER") {
            Write-Host "Installer detected; runtime will be tested after installation."
            exit 0
          }

          $exe = (
            Get-Content `
              "$root\evidence\exe.txt"
          ).Substring(4)

          $out = "$root\evidence\runtime-out.txt"
          $err = "$root\evidence\runtime-err.txt"

          $sw = [Diagnostics.Stopwatch]::StartNew()

          $p = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -PassThru

          $finished = $p.WaitForExit(60000)

          $sw.Stop()

          if (-not $finished) {

            Stop-Process `
              -Id $p.Id `
              -Force `
              -ErrorAction SilentlyContinue

            [ordered]@{
              mode = "PORTABLE"
              result = "TIMEOUT"
              pid = $p.Id
              duration_ms = $sw.ElapsedMilliseconds
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\runtime.json"

            throw "Portable EXE timeout."
          }

          [ordered]@{
            mode = "PORTABLE"
            result = if ($p.ExitCode -eq 0) {
              "PASS"
            } else {
              "FAIL"
            }
            exit_code = $p.ExitCode
            duration_ms = $sw.ElapsedMilliseconds
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\runtime.json"

          if ($p.ExitCode -ne 0) {
            throw "Portable EXE exit code $($p.ExitCode)."
          }

      - name: Installer execution if safely proven
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -ne "INSTALLER") {
            Write-Host "NOT AN INSTALLER."
            exit 0
          }

          $exe = (
            Get-Content `
              "$root\evidence\exe.txt"
          ).Substring(4)

          $framework = @(
            $det.frameworks
          ) | Select-Object -First 1

          $args = $null

          if ($framework -eq "NSIS") {
            $args = @("/S")
          }
          elseif ($framework -eq "INNO_SETUP") {
            $args = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            )
          }

          if ($null -eq $args) {

            [ordered]@{
              result = "INSTALLER_DETECTED"
              execution = "NOT_PERFORMED"
              reason = "SAFE_SILENT_SWITCH_NOT_PROVEN"
              framework = $framework
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\install.json"

            exit 0
          }

          $sw = [Diagnostics.Stopwatch]::StartNew()

          $p = Start-Process `
            -FilePath $exe `
            -ArgumentList $args `
            -PassThru `
            -Wait

          $sw.Stop()

          [ordered]@{
            result = if ($p.ExitCode -eq 0) {
              "PASS"
            } else {
              "FAIL"
            }
            framework = $framework
            arguments = $args
            exit_code = $p.ExitCode
            duration_ms = $sw.ElapsedMilliseconds
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\install.json"

          if ($p.ExitCode -ne 0) {
            throw "Installer exit code $($p.ExitCode)."
          }

      - name: Discover installed program
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -ne "INSTALLER") {
            exit 0
          }

          $paths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $entries = @()

          foreach ($path in $paths) {

            $entries += Get-ItemProperty `
              $path `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -match `
                "(?i)Goodday|Goodbay|KHALED|GQS"
              } |
              Select-Object `
                DisplayName,
                DisplayVersion,
                InstallLocation,
                UninstallString,
                QuietUninstallString
          }

          [ordered]@{
            uninstall_entries = @($entries)
          } |
            ConvertTo-Json -Depth 20 |
            Out-File `
              "$root\evidence\installed.json"

      - name: Run installed executable
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -ne "INSTALLER") {
            exit 0
          }

          if (-not (Test-Path "$root\evidence\installed.json")) {
            exit 0
          }

          $data = Get-Content `
            "$root\evidence\installed.json" |
            ConvertFrom-Json

          $candidate = $null

          foreach ($entry in @($data.uninstall_entries)) {

            if ($entry.InstallLocation) {

              if (Test-Path $entry.InstallLocation) {

                $found = Get-ChildItem `
                  $entry.InstallLocation `
                  -Recurse `
                  -File `
                  -Filter "GooddayGoodbay220.exe" `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $candidate = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $candidate) {

            [ordered]@{
              result = "INSTALLED_EXE_NOT_FOUND"
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\installed-runtime.json"

            exit 0
          }

          $p = Start-Process `
            -FilePath $candidate `
            -PassThru

          Start-Sleep 10

          $alive = -not $p.HasExited

          $code = $null

          if ($p.HasExited) {
            $code = $p.ExitCode
          }

          if ($alive) {
            Stop-Process `
              -Id $p.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

          [ordered]@{
            result = if ($alive -or $code -eq 0) {
              "PASS"
            } else {
              "FAIL"
            }
            executable = $candidate
            pid = $p.Id
            alive_after_10_seconds = $alive
            exit_code = $code
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\installed-runtime.json"

      - name: Real registered uninstall
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -ne "INSTALLER") {
            exit 0
          }

          if (-not (Test-Path "$root\evidence\installed.json")) {
            exit 0
          }

          $data = Get-Content `
            "$root\evidence\installed.json" |
            ConvertFrom-Json

          $entry = @(
            $data.uninstall_entries
          ) | Select-Object -First 1

          if (-not $entry) {

            [ordered]@{
              result = "NO_REGISTERED_UNINSTALLER"
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\uninstall.json"

            exit 0
          }

          $command = $entry.QuietUninstallString

          if (-not $command) {
            $command = $entry.UninstallString
          }

          if (-not $command) {

            [ordered]@{
              result = "NO_UNINSTALL_COMMAND"
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\uninstall.json"

            exit 0
          }

          "COMMAND=$command" |
            Out-File `
              "$root\evidence\uninstall-command.txt"

          try {

            $p = Start-Process `
              -FilePath "cmd.exe" `
              -ArgumentList "/c", $command `
              -PassThru `
              -Wait

            $code = $p.ExitCode

          } catch {

            $code = -999

            $_ |
              Out-File `
                "$root\evidence\uninstall-error.txt"
          }

          [ordered]@{
            result = if ($code -eq 0) {
              "PASS"
            } else {
              "FAIL_OR_INTERACTIVE"
            }
            exit_code = $code
            command = $command
          } |
            ConvertTo-Json |
            Out-File `
              "$root\evidence\uninstall.json"

      - name: Verify cleanup
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          if ($det.type -ne "INSTALLER") {

            [ordered]@{
              result = "NOT_APPLICABLE_PORTABLE"
            } |
              ConvertTo-Json |
              Out-File `
                "$root\evidence\cleanup.json"

            exit 0
          }

          $paths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $remainingRegistry = @()

          foreach ($path in $paths) {

            $remainingRegistry += `
              Get-ItemProperty `
              $path `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -match `
                "(?i)Goodday|Goodbay|KHALED|GQS"
              }
          }

          $processes = @(
            Get-Process `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match `
                "(?i)Goodday|Goodbay|KHALED|GQS"
              }
          )

          $desktop = @(
            Get-ChildItem `
              "$env:USERPROFILE\Desktop" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match `
                "(?i)Goodday|Goodbay|KHALED|GQS"
              }
          )

          $startmenu = @(
            Get-ChildItem `
              "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match `
                "(?i)Goodday|Goodbay|KHALED|GQS"
              }
          )

          $registryClean = `
            $remainingRegistry.Count -eq 0

          $processClean = `
            $processes.Count -eq 0

          $desktopClean = `
            $desktop.Count -eq 0

          $startMenuClean = `
            $startmenu.Count -eq 0

          $pass = `
            $registryClean -and `
            $processClean -and `
            $desktopClean -and `
            $startMenuClean

          [ordered]@{
            result = if ($pass) {
              "PASS"
            } else {
              "INCOMPLETE_CLEANUP"
            }
            registry_clean = $registryClean
            processes_clean = $processClean
            desktop_clean = $desktopClean
            startmenu_clean = $startMenuClean
            remaining_registry = @($remainingRegistry)
            remaining_processes = @($processes)
            remaining_desktop = @($desktop)
            remaining_startmenu = @($startmenu)
          } |
            ConvertTo-Json -Depth 30 |
            Out-File `
              "$root\evidence\cleanup.json"

      - name: Final evidence
        shell: powershell
        run: |

          $root = $env:GITHUB_WORKSPACE

          Get-Process |
            Sort-Object ProcessName |
            Out-File `
              "$root\evidence\process-after.txt"

          $det = Get-Content `
            "$root\evidence\installer-detection.json" |
            ConvertFrom-Json

          $runtime = $null
          $install = $null
          $installedRuntime = $null
          $uninstall = $null
          $cleanup = $null

          foreach ($name in @(
            "runtime",
            "install",
            "installed-runtime",
            "uninstall",
            "cleanup"
          )) {

            $p = "$root\evidence\$name.json"

            if (Test-Path $p) {

              try {

                $v = Get-Content $p |
                  ConvertFrom-Json

                switch ($name) {
                  "runtime" {
                    $runtime = $v
                  }
                  "install" {
                    $install = $v
                  }
                  "installed-runtime" {
                    $installedRuntime = $v
                  }
                  "uninstall" {
                    $uninstall = $v
                  }
                  "cleanup" {
                    $cleanup = $v
                  }
                }

              } catch {}
            }
          }

          if ($det.type -eq "PORTABLE_OR_UNKNOWN") {

            if ($runtime.result -eq "PASS") {
              $verdict = "PASS_WINDOWS_PORTABLE_RUNTIME"
            } else {
              $verdict = "FAIL_WINDOWS_PORTABLE_RUNTIME"
            }

          }
          elseif ($det.type -eq "INSTALLER") {

            if (
              $install.result -eq
              "INSTALLER_DETECTED"
            ) {

              $verdict =
                "INSTALLER_DETECTED_BUT_NOT_SAFELY_AUTOMATED"

            }
            elseif (
              $install.result -eq "PASS" -and
              $installedRuntime.result -eq "PASS" -and
              $uninstall.result -eq "PASS" -and
              $cleanup.result -eq "PASS"
            ) {

              $verdict =
                "PASS_WINDOWS_INSTALL_RUN_UNINSTALL_CLEANUP"

            }
            else {

              $verdict =
                "WINDOWS_INSTALL_UNINSTALL_INCOMPLETE"

            }
          }
          else {

            $verdict = "UNKNOWN"
          }

          [ordered]@{
            project = "GooddayGoodbay220"
            windows_runner = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            verdict = $verdict
            installer_detection = $det
            runtime = $runtime
            install = $install
            installed_runtime = $installedRuntime
            uninstall = $uninstall
            cleanup = $cleanup
            autocad = "NOT_TESTED_BY_DESIGN"
            revit = "NOT_TESTED_BY_DESIGN"
            fake_pass = $false
            generated_utc = `
              (Get-Date).ToUniversalTime().ToString("o")
          } |
            ConvertTo-Json -Depth 40 |
            Out-File `
              "$root\evidence\FINAL_WINDOWS_REAL_VERDICT.json"

          Get-Content `
            "$root\evidence\FINAL_WINDOWS_REAL_VERDICT.json"

      - name: Upload complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: GooddayGoodbay220-REAL-WINDOWS-COMPLETE
          path: evidence/**
          if-no-files-found: error
