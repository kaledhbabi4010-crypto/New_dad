name: GOODDAYGOODBAY220 FACTORY V3

on:
  workflow_dispatch:
    inputs:
      package_url:
        required: true
        type: string
      expected_zip_sha256:
        required: true
        type: string
      expected_exe_sha256:
        required: true
        type: string
      test_id:
        required: true
        type: string
      attempt:
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:

      - name: Prepare
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\RESULT" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\WORK" | Out-Null

      - name: Download package
        shell: powershell
        run: |
          $url = "${{ inputs.package_url }}"
          Invoke-WebRequest -Uri $url -OutFile "$env:GITHUB_WORKSPACE\WORK\package.zip"
          $actual = (Get-FileHash "$env:GITHUB_WORKSPACE\WORK\package.zip" -Algorithm SHA256).Hash.ToLower()
          $expected = "${{ inputs.expected_zip_sha256 }}".ToLower()

          if ($actual -ne $expected) {
            throw "PACKAGE_HASH_MISMATCH actual=$actual expected=$expected"
          }

      - name: Extract package
        shell: powershell
        run: |
          Expand-Archive "$env:GITHUB_WORKSPACE\WORK\package.zip" "$env:GITHUB_WORKSPACE\WORK\PKG" -Force

          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\WORK\PKG" -Filter *.exe -Recurse

          if ($exe.Count -ne 1) {
            throw "EXPECTED_ONE_EXE actual=$($exe.Count)"
          }

          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower()
          $expected = "${{ inputs.expected_exe_sha256 }}".ToLower()

          if ($hash -ne $expected) {
            throw "EXE_HASH_MISMATCH actual=$hash expected=$expected"
          }

      - name: Execute selected test
        shell: powershell
        env:
          TEST_ID: ${{ inputs.test_id }}
        run: |
          $ErrorActionPreference = "Continue"

          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\WORK\PKG" -Filter *.exe -Recurse | Select-Object -First 1
          $exePath = $exe.FullName
          $exeName = $exe.Name

          $result = [ordered]@{
            schema = "GOODDAYGOODBAY220_FACTORY_V3"
            test_id = $env:TEST_ID
            attempt = "${{ inputs.attempt }}"
            timestamp_utc = (Get-Date).ToUniversalTime().ToString("o")
            host = [ordered]@{
              os = (Get-CimInstance Win32_OperatingSystem).Caption
              version = (Get-CimInstance Win32_OperatingSystem).Version
              architecture = $env:PROCESSOR_ARCHITECTURE
              powershell = $PSVersionTable.PSVersion.ToString()
            }
            executable = [ordered]@{
              name = $exeName
              path = $exePath
              sha256 = (Get-FileHash $exePath -Algorithm SHA256).Hash
              size = $exe.Length
            }
            status = "UNVERIFIED"
            evidence = @()
            observations = @()
            errors = @()
          }

          function Add-Evidence($x) {
            $result.evidence += $x
          }

          function Add-Observation($x) {
            $result.observations += $x
          }

          function Add-Error($x) {
            $result.errors += $x
          }

          function Save-Result {
            $result | ConvertTo-Json -Depth 10 |
              Set-Content "$env:GITHUB_WORKSPACE\RESULT\$env:TEST_ID.json" -Encoding UTF8
          }

          function Find-Processes {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Path -eq $exePath -or $_.Name -eq [System.IO.Path]::GetFileNameWithoutExtension($exeName)
              }
          }

          # ------------------------------------------------
          # ENVIRONMENT
          # ------------------------------------------------
          if ($env:TEST_ID -eq "environment") {

            $result.status = "PASS"

            Add-Evidence @{
              type = "environment"
              os = $result.host.os
              version = $result.host.version
              architecture = $result.host.architecture
              powershell = $result.host.powershell
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # PACKAGE
          # ------------------------------------------------
          if ($env:TEST_ID -eq "package") {

            $result.status = "PASS"

            Add-Evidence @{
              type = "package_integrity"
              zip_sha256 = "${{ inputs.expected_zip_sha256 }}"
              exe_sha256 = "${{ inputs.expected_exe_sha256 }}"
              verified = $true
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # PE
          # ------------------------------------------------
          if ($env:TEST_ID -eq "pe") {

            try {
              $bytes = [System.IO.File]::ReadAllBytes($exePath)

              $mz = ($bytes.Length -ge 2 -and
                     $bytes[0] -eq 0x4D -and
                     $bytes[1] -eq 0x5A)

              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

              $peOk = (
                $peOffset -ge 0 -and
                $peOffset + 4 -lt $bytes.Length -and
                $bytes[$peOffset] -eq 0x50 -and
                $bytes[$peOffset+1] -eq 0x45 -and
                $bytes[$peOffset+2] -eq 0x00 -and
                $bytes[$peOffset+3] -eq 0x00
              )

              Add-Evidence @{
                type = "pe_header"
                mz = $mz
                pe = $peOk
                pe_offset = $peOffset
              }

              $sig = Get-AuthenticodeSignature $exePath

              Add-Evidence @{
                type = "authenticode"
                status = $sig.Status.ToString()
                signer = if ($sig.SignerCertificate) {
                  $sig.SignerCertificate.Subject
                } else {
                  $null
                }
              }

              if ($mz -and $peOk) {
                $result.status = "PASS"
              } else {
                $result.status = "FAIL"
                Add-Error "Invalid PE/MZ structure"
              }

            } catch {
              $result.status = "FAIL"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # RUNTIME
          # ------------------------------------------------
          if ($env:TEST_ID -eq "runtime") {

            $before = @(Find-Processes)

            try {

              $sw = [Diagnostics.Stopwatch]::StartNew()

              $p = Start-Process `
                -FilePath $exePath `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              Start-Sleep -Seconds 5

              $alive = -not $p.HasExited

              $exitCode = $null

              if (-not $alive) {
                $exitCode = $p.ExitCode
              }

              $sw.Stop()

              Add-Evidence @{
                type = "launch"
                started = $true
                pid = $p.Id
                alive_after_5s = $alive
                exit_code = $exitCode
                observation_seconds = $sw.Elapsed.TotalSeconds
              }

              if ($alive) {
                $result.status = "PASS"
                Add-Observation "Process remained alive for observation window."
              } else {
                if ($exitCode -eq 0) {
                  $result.status = "PASS"
                  Add-Observation "Process exited normally with code 0."
                } else {
                  $result.status = "FAIL"
                  Add-Error "Process exited during launch observation with exit code $exitCode"
                }
              }

              if ($alive) {
                try {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                } catch {}
              }

            } catch {
              $result.status = "FAIL"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # REPEAT LAUNCH
          # ------------------------------------------------
          if ($env:TEST_ID -eq "repeat_launch") {

            $runs = @()

            for ($i = 1; $i -le 3; $i++) {

              try {

                $p = Start-Process `
                  -FilePath $exePath `
                  -PassThru `
                  -WorkingDirectory $exe.DirectoryName

                Start-Sleep -Seconds 4

                $alive = -not $p.HasExited
                $exitCode = $null

                if (-not $alive) {
                  $exitCode = $p.ExitCode
                }

                $runs += @{
                  iteration = $i
                  started = $true
                  pid = $p.Id
                  alive_after_4s = $alive
                  exit_code = $exitCode
                }

                if ($alive) {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                }

              } catch {
                $runs += @{
                  iteration = $i
                  started = $false
                  error = $_.Exception.Message
                }
              }
            }

            Add-Evidence @{
              type = "repeat_launch"
              runs = $runs
            }

            $successful = @(
              $runs | Where-Object {
                $_.started -eq $true
              }
            ).Count

            if ($successful -eq 3) {
              $result.status = "PASS"
            } else {
              $result.status = "FAIL"
              Add-Error "Not all repeated launches started successfully."
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # PROCESS LIFECYCLE
          # ------------------------------------------------
          if ($env:TEST_ID -eq "process_lifecycle") {

            try {

              $p = Start-Process `
                -FilePath $exePath `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              Start-Sleep -Seconds 3

              $started = -not $p.HasExited

              if ($started) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 2
              }

              $stillThere = Get-Process -Id $p.Id -ErrorAction SilentlyContinue

              Add-Evidence @{
                type = "process_lifecycle"
                pid = $p.Id
                started = $started
                terminated = ($null -eq $stillThere)
              }

              if ($started -and $null -eq $stillThere) {
                $result.status = "PASS"
              } else {
                $result.status = "FAIL"
                Add-Error "Process lifecycle did not complete cleanly."
              }

            } catch {
              $result.status = "FAIL"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # FILESYSTEM
          # ------------------------------------------------
          if ($env:TEST_ID -eq "filesystem") {

            $roots = @(
              "$env:LOCALAPPDATA",
              "$env:APPDATA",
              "$env:PROGRAMDATA",
              "$env:TEMP"
            )

            $before = @()

            foreach ($root in $roots) {
              if (Test-Path $root) {
                try {
                  $before += Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                    Where-Object {
                      $_.Name -match "Goodday|Goodbay|QuickService"
                    } |
                    Select-Object FullName,Length,LastWriteTime
                } catch {}
              }
            }

            try {
              $p = Start-Process `
                -FilePath $exePath `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              Start-Sleep -Seconds 5

              if (-not $p.HasExited) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }

            } catch {}

            $after = @()

            foreach ($root in $roots) {
              if (Test-Path $root) {
                try {
                  $after += Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
                    Where-Object {
                      $_.Name -match "Goodday|Goodbay|QuickService"
                    } |
                    Select-Object FullName,Length,LastWriteTime
                } catch {}
              }
            }

            Add-Evidence @{
              type = "filesystem"
              before_count = $before.Count
              after_count = $after.Count
              after = $after
            }

            # Observation only; changes are not automatically failures.
            $result.status = "PASS"
            Add-Observation "Filesystem behavior was observed without modifying the program."

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # REGISTRY
          # ------------------------------------------------
          if ($env:TEST_ID -eq "registry") {

            $paths = @(
              "HKCU:\Software\Goodday",
              "HKCU:\Software\Goodbay",
              "HKCU:\Software\QuickService",
              "HKLM:\Software\Goodday",
              "HKLM:\Software\Goodbay",
              "HKLM:\Software\QuickService"
            )

            $found = @()

            foreach ($path in $paths) {
              if (Test-Path $path) {
                $found += $path
              }
            }

            Add-Evidence @{
              type = "registry"
              relevant_keys_found = $found
            }

            # Registry presence alone is not a failure.
            $result.status = "PASS"

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # RESOURCE
          # ------------------------------------------------
          if ($env:TEST_ID -eq "resource") {

            try {

              $p = Start-Process `
                -FilePath $exePath `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              Start-Sleep -Seconds 5

              if ($p.HasExited) {

                Add-Evidence @{
                  type = "resource"
                  applicable = $false
                  reason = "Process exited before resource sampling."
                  exit_code = $p.ExitCode
                }

                $result.status = "UNVERIFIED"

              } else {

                $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue

                if ($proc) {

                  $cpu = $proc.CPU
                  $memory = $proc.WorkingSet64

                  Add-Evidence @{
                    type = "resource"
                    applicable = $true
                    cpu_seconds = $cpu
                    working_set_bytes = $memory
                  }

                  $result.status = "PASS"
                }

                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }

            } catch {
              $result.status = "UNVERIFIED"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # HELP
          # ------------------------------------------------
          if ($env:TEST_ID -eq "help") {

            try {

              $outFile = "$env:GITHUB_WORKSPACE\WORK\help.out.txt"
              $errFile = "$env:GITHUB_WORKSPACE\WORK\help.err.txt"

              $p = Start-Process `
                -FilePath $exePath `
                -ArgumentList "--help" `
                -RedirectStandardOutput $outFile `
                -RedirectStandardError $errFile `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              $finished = $p.WaitForExit(5000)

              $stdout = if (Test-Path $outFile) {
                Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              } else { "" }

              $stderr = if (Test-Path $errFile) {
                Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              } else { "" }

              if (-not $finished) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }

              Add-Evidence @{
                type = "help"
                finished = $finished
                exit_code = if ($finished) { $p.ExitCode } else { $null }
                stdout_length = $stdout.Length
                stderr_length = $stderr.Length
              }

              # GUI programs commonly do not implement --help.
              $result.status = "PASS"
              Add-Observation "Help invocation was tested; absence of CLI help is not treated as program failure."

            } catch {
              $result.status = "UNVERIFIED"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # VERSION
          # ------------------------------------------------
          if ($env:TEST_ID -eq "version") {

            try {

              $outFile = "$env:GITHUB_WORKSPACE\WORK\version.out.txt"
              $errFile = "$env:GITHUB_WORKSPACE\WORK\version.err.txt"

              $p = Start-Process `
                -FilePath $exePath `
                -ArgumentList "--version" `
                -RedirectStandardOutput $outFile `
                -RedirectStandardError $errFile `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              $finished = $p.WaitForExit(5000)

              $stdout = if (Test-Path $outFile) {
                Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              } else { "" }

              $stderr = if (Test-Path $errFile) {
                Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              } else { "" }

              if (-not $finished) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }

              Add-Evidence @{
                type = "version"
                finished = $finished
                exit_code = if ($finished) { $p.ExitCode } else { $null }
                stdout_length = $stdout.Length
                stderr_length = $stderr.Length
              }

              $result.status = "PASS"
              Add-Observation "Version invocation was tested without assuming CLI support."

            } catch {
              $result.status = "UNVERIFIED"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # CRASH DETECTION
          # ------------------------------------------------
          if ($env:TEST_ID -eq "crash_detection") {

            try {

              $start = Get-Date

              $p = Start-Process `
                -FilePath $exePath `
                -PassThru `
                -WorkingDirectory $exe.DirectoryName

              Start-Sleep -Seconds 5

              $end = Get-Date

              $events = @()

              try {

                $events = Get-WinEvent -FilterHashtable @{
                  LogName = "Application"
                  StartTime = $start.AddSeconds(-5)
                  EndTime = $end.AddSeconds(10)
                } -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Message -match "GooddayGoodbay220|Goodday|Goodbay"
                } |
                Select-Object TimeCreated,Id,ProviderName,LevelDisplayName,Message

              } catch {}

              $alive = -not $p.HasExited

              Add-Evidence @{
                type = "crash_detection"
                alive_after_5s = $alive
                event_count = $events.Count
                events = $events
              }

              if ($alive -or $events.Count -eq 0) {
                $result.status = "PASS"
              } else {
                $result.status = "FAIL"
                Add-Error "Correlated Windows Application event(s) detected during launch."
              }

              if ($alive) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }

            } catch {
              $result.status = "UNVERIFIED"
              Add-Error $_.Exception.Message
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # INSTALLER / UNINSTALLER
          # ------------------------------------------------
          if ($env:TEST_ID -eq "installer") {

            $result.status = "NOT_APPLICABLE"

            Add-Evidence @{
              type = "installer"
              reason = "Current package contains one executable and no installer package."
            }

            Save-Result
            exit 0
          }

          if ($env:TEST_ID -eq "uninstaller") {

            $result.status = "NOT_APPLICABLE"

            Add-Evidence @{
              type = "uninstaller"
              reason = "No installer/uninstaller was included in the verified package."
            }

            Save-Result
            exit 0
          }

          # ------------------------------------------------
          # UNKNOWN TEST
          # ------------------------------------------------
          $result.status = "FAIL"
          Add-Error "Unknown test_id=$env:TEST_ID"

          Save-Result
          exit 1

      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOODDAYGOODBAY220-${{ inputs.test_id }}-${{ inputs.attempt }}
          path: |
            RESULT/**
            WORK/**
          if-no-files-found: warn
