name: GOODDAY Real Autodesk Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  windows-environment-proof:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows proof
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          systeminfo | Out-File evidence/windows-systeminfo.txt
          Get-CimInstance Win32_OperatingSystem |
            Format-List * |
            Out-File evidence/windows-os.txt

          $bins = @(
            "Revit.exe",
            "acad.exe",
            "accoreconsole.exe",
            "RevitTestFrameworkConsole.exe"
          )

          foreach ($b in $bins) {
            Get-ChildItem C:\ -Filter $b -File -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Out-File -Append evidence/autodesk-binaries.txt
          }

          Write-Host "WINDOWS_RUNNER_REAL=true"

          if (Test-Path evidence/autodesk-binaries.txt) {
            $x = Get-Content evidence/autodesk-binaries.txt
            if ($x.Count -gt 0) {
              Write-Host "AUTODESK_BINARY_FOUND=true"
            } else {
              Write-Host "AUTODESK_BINARY_FOUND=false"
            }
          }

      - name: Python validation
        shell: powershell
        run: |
          python --version
          python GOODBAY220_SPECIFICATION.py --help
          python GOODBAY220_SPECIFICATION.py status
          python GOODBAY220_SPECIFICATION.py verify
          python GOODBAY220_SPECIFICATION.py diagnose

      - name: Upload Windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: goodday-windows-evidence
          path: evidence/


  authorized-autodesk-runner:
    if: ${{ false }}
    runs-on:
      - self-hosted
      - windows
      - autodesk
      - revit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Revit
        shell: powershell
        run: |
          $revit = Get-ChildItem C:\ -Filter Revit.exe `
            -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $revit) {
            throw "REAL_REVIT_NOT_FOUND"
          }

          Write-Host "REAL_REVIT_PATH=$($revit.FullName)"
          & $revit.FullName /? 2>&1 | Out-File revit-start.txt

      - name: Upload Autodesk evidence
        uses: actions/upload-artifact@v4
        with:
          name: goodday-autodesk-evidence
          path: ./
