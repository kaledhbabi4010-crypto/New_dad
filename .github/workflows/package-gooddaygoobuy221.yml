name: Package gooddaygoobuy 221

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Gooddaygoobuy221/**"
      - ".github/workflows/package-gooddaygoobuy221.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package metadata and executable hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "Gooddaygoobuy221"
          $metadataPath = Join-Path $root "package.json"
          if (!(Test-Path $metadataPath)) { throw "package.json missing" }
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $exe = Join-Path $root $metadata.application_binary
          if (!(Test-Path $exe)) { throw "Application executable missing: $exe" }
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.application_binary_sha256.ToLowerInvariant()) {
            throw "Executable SHA256 mismatch. Expected $($metadata.application_binary_sha256); got $actual"
          }
          "PACKAGE_METADATA_VALID"
          "EXECUTABLE_SHA256=$actual"

      - name: Validate archive contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "Gooddaygoobuy221"
          $zip = Join-Path $env:RUNNER_TEMP "gooddaygoobuy 221.Zip"
          $unpack = Join-Path $env:RUNNER_TEMP "gooddaygoobuy221-unpack"
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $zip -Force
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          if (!(Test-Path (Join-Path $unpack "package.json"))) { throw "Archive missing package.json" }
          $metadata = Get-Content (Join-Path $unpack "package.json") -Raw | ConvertFrom-Json
          $exe = Join-Path $unpack $metadata.application_binary
          if (!(Test-Path $exe)) { throw "Archive missing application executable" }
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.application_binary_sha256.ToLowerInvariant()) { throw "Archived executable hash mismatch" }
          "ARCHIVE_ROUNDTRIP_PASS"
          "ARCHIVE_PATH=$zip"

      - name: Attempt real Windows executable launch
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "Gooddaygoobuy221"
          $exe = Join-Path $root "app\GooddayGoodbay220.exe"
          $evidence = Join-Path $env:RUNNER_TEMP "goodday221-runtime"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "EXE_SHA256=$hash" | Set-Content (Join-Path $evidence "runtime.txt")
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) {
              "STARTED=TRUE" | Add-Content (Join-Path $evidence "runtime.txt")
              "RUNNING_AFTER_10_SECONDS=FALSE" | Add-Content (Join-Path $evidence "runtime.txt")
              "EXIT_CODE=$($p.ExitCode)" | Add-Content (Join-Path $evidence "runtime.txt")
            } else {
              "STARTED=TRUE" | Add-Content (Join-Path $evidence "runtime.txt")
              "RUNNING_AFTER_10_SECONDS=TRUE" | Add-Content (Join-Path $evidence "runtime.txt")
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          } catch {
            "STARTED=FALSE" | Add-Content (Join-Path $evidence "runtime.txt")
            $_ | Out-File (Join-Path $evidence "launch-error.txt") -Encoding utf8
          }

      - name: Upload requested ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: gooddaygoobuy 221
          path: ${{ runner.temp }}/gooddaygoobuy 221.Zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooddaygoobuy-221-runtime-evidence
          path: ${{ runner.temp }}/goodday221-runtime
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce truthful runtime result
        if: always()
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "goodday221-runtime\runtime.txt"
          if (!(Test-Path $result)) { throw "RUNTIME_EVIDENCE_MISSING" }
          $raw = Get-Content $result -Raw
          if ($raw -notmatch "RUNNING_AFTER_10_SECONDS=TRUE") {
            throw "RUNTIME_TEST_FAILED: application did not remain running for 10 seconds. Inspect the runtime evidence artifact."
          }
