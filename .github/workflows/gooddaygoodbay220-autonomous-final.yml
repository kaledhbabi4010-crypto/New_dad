name: GOODDAYGOODBAY220 AUTONOMOUS FINAL FACTORY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  production-windows:

    runs-on: windows-latest

    timeout-minutes: 90

    steps:

      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "GITHUB_SHA=$env:GITHUB_SHA"
          git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Windows inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption,Version,OSArchitecture
          python --version
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Production syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem GOODDAYGOOBUY220_FINAL -Recurse -Filter *.py |
            ForEach-Object {

              if ($_.Name -eq "WINDOWS_AUTONOMOUS_FINAL_BUILDER.py") {
                return
              }

              python -m py_compile "$($_.FullName)"

              if ($LASTEXITCODE -ne 0) {
                throw "Compile failed: $($_.FullName)"
              }
            }

      - name: Real imports
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $env:PYTHONPATH = "$PWD\GOODDAYGOOBUY220_FINAL"

          python -c "import KHALED27_WORKFLOW; print('REAL_IMPORT_PASS:KHALED27_WORKFLOW')"

          if ($LASTEXITCODE -ne 0) {
            throw "KHALED27_WORKFLOW import failed"
          }

          python -c "import RUN_GOODDAYGOOBUY220; print('REAL_IMPORT_PASS:RUN_GOODDAYGOOBUY220')"

          if ($LASTEXITCODE -ne 0) {
            throw "RUN_GOODDAYGOOBUY220 import failed"
          }

      - name: Autonomous native Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python GOODDAYGOOBUY220_FINAL\WINDOWS_AUTONOMOUS_FINAL_BUILDER.py

          if ($LASTEXITCODE -ne 0) {
            throw "Windows builder failed"
          }

      - name: Verify final EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "WINDOWS_RELEASE\package\GooddayGoodbay220\GooddayGoodbay220.exe"

          if (!(Test-Path $exe)) {
            throw "EXE missing"
          }

          $bytes = [System.IO.File]::ReadAllBytes(
            (Resolve-Path $exe)
          )

          if ($bytes.Length -lt 2) {
            throw "EXE empty"
          }

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Not a Windows PE executable"
          }

          Write-Host "EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"

      - name: Verify final ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "WINDOWS_RELEASE\GooddayGoodbay220.zip"

          if (!(Test-Path $zip)) {
            throw "ZIP missing"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $zip)
          )

          try {

            $expected = "GooddayGoodbay220/GooddayGoodbay220.exe"

            if (
              -not (
                $archive.Entries.FullName -contains $expected
              )
            ) {
              throw "EXE missing from ZIP"
            }

          }
          finally {
            $archive.Dispose()
          }

          Write-Host "ZIP_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash)"

      - name: Final evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @"
          GOODDAYGOODBAY220 FINAL WINDOWS EVIDENCE
          PRODUCT=GooddayGoodbay220
          SOURCE_COMMIT=$env:GITHUB_SHA
          EXE_SHA256=$((Get-FileHash WINDOWS_RELEASE\package\GooddayGoodbay220\GooddayGoodbay220.exe -Algorithm SHA256).Hash)
          ZIP_SHA256=$((Get-FileHash WINDOWS_RELEASE\GooddayGoodbay220.zip -Algorithm SHA256).Hash)
          STATUS=WINDOWS_PACKAGE_BUILT_AND_VERIFIED
          "@ | Out-File WINDOWS_RELEASE\GITHUB_FINAL_EVIDENCE.txt -Encoding utf8

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooddayGoodbay220-AUTONOMOUS-FINAL
          path: |
            WINDOWS_RELEASE/GooddayGoodbay220.zip
            WINDOWS_RELEASE/package/GooddayGoodbay220/GooddayGoodbay220.exe
            WINDOWS_RELEASE/package/GooddayGoodbay220/BUILD_EVIDENCE.json
            WINDOWS_RELEASE/FINAL_WINDOWS_EVIDENCE.json
            WINDOWS_RELEASE/GITHUB_FINAL_EVIDENCE.txt
            WINDOWS_RELEASE/BUILD_ATTEMPTS.json
          if-no-files-found: error
