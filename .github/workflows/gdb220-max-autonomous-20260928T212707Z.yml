name: GDB220 MAX AUTONOMOUS WINDOWS VERIFY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:

      - name: Download EXACT candidate ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/kaledhbabi4010-crypto/New_dad/main/__GDB220_AUTOTEST__/20260928T212707Z/GooddayGoodbay220_CANDIDATE.zip"
          $zip = "$env:RUNNER_TEMP\\GooddayGoodbay220_CANDIDATE.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "candidate_sha256=$sha" | Out-File `
            "$env:GITHUB_WORKSPACE\\candidate.txt"

          if ($sha -ne "d0b45188136fab7b9fe4023070c6dfb69ae6f1ab1181e1070766e56a11ba093c") {
            throw "CANDIDATE_SHA256_MISMATCH expected=d0b45188136fab7b9fe4023070c6dfb69ae6f1ab1181e1070766e56a11ba093c actual=$sha"
          }

          Write-Host "EXACT_CANDIDATE_HASH_OK"

      - name: Extract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:RUNNER_TEMP\\GooddayGoodbay220_CANDIDATE.zip"
          $dir = "$env:RUNNER_TEMP\\gdb220"

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Get-ChildItem $dir -Recurse | Format-List

      - name: Discover EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem `
            "$env:RUNNER_TEMP\\gdb220" `
            -Filter "*.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "NO_EXE_FOUND_IN_CANDIDATE"
          }

          "EXE=$($exe.FullName)" | Out-File `
            "$env:GITHUB_WORKSPACE\\exe.txt"

          $sha = (Get-FileHash `
            $exe.FullName `
            -Algorithm SHA256).Hash.ToLower()

          "EXE_SHA256=$sha" | Out-File `
            "$env:GITHUB_WORKSPACE\\exe.txt" `
            -Append

      - name: PE verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exeLine = Get-Content `
            "$env:GITHUB_WORKSPACE\\exe.txt" |
            Select-Object -First 1

          $exe = $exeLine.Substring(4)

          $bytes = [System.IO.File]::ReadAllBytes($exe)

          if ($bytes.Length -lt 64) {
            throw "EXE_TOO_SMALL"
          }

          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw "MZ_SIGNATURE_MISSING"
          }

          $offset = [BitConverter]::ToInt32($bytes, 60)

          if ($offset -lt 0 -or `
              $offset + 4 -gt $bytes.Length) {
            throw "INVALID_PE_OFFSET"
          }

          $pe = [System.Text.Encoding]::ASCII.GetString(
            $bytes,
            $offset,
            4
          )

          if ($pe -ne "PE`0`0") {
            throw "PE_SIGNATURE_MISSING"
          }

          "PE_OK=true" | Out-File `
            "$env:GITHUB_WORKSPACE\\pe.txt"

      - name: Runtime lifecycle and resource test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exeLine = Get-Content `
            "$env:GITHUB_WORKSPACE\\exe.txt" |
            Select-Object -First 1

          $exe = $exeLine.Substring(4)

          $samples = @()
          $events = @()

          $sw = [Diagnostics.Stopwatch]::StartNew()

          $p = Start-Process `
            -FilePath $exe `
            -PassThru

          $events += [ordered]@{
            event="STARTED"
            pid=$p.Id
            t_ms=$sw.ElapsedMilliseconds
          }

          for ($i=0; $i -lt 20; $i++) {

            Start-Sleep -Milliseconds 250

            if (-not $p.HasExited) {

              try {
                $p.Refresh()

                $samples += [ordered]@{
                  t_ms=$sw.ElapsedMilliseconds
                  pid=$p.Id
                  cpu=$p.CPU
                  working_set=$p.WorkingSet64
                  private_memory=$p.PrivateMemorySize64
                }

              } catch {
                $samples += [ordered]@{
                  t_ms=$sw.ElapsedMilliseconds
                  pid=$p.Id
                  sample_error=$_.Exception.Message
                }
              }

            } else {
              break
            }
          }

          if ($p.HasExited) {
            $events += [ordered]@{
              event="EXITED"
              pid=$p.Id
              exit_code=$p.ExitCode
              t_ms=$sw.ElapsedMilliseconds
            }
          } else {
            $events += [ordered]@{
              event="STILL_RUNNING"
              pid=$p.Id
              t_ms=$sw.ElapsedMilliseconds
            }

            Stop-Process `
              -Id $p.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $appEvents = @()

          try {
            $appEvents = Get-WinEvent `
              -FilterHashtable @{
                LogName="Application"
                StartTime=(Get-Date).AddMinutes(-10)
              } `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Message -match "Goodday|Goodbay|Application Error"
              } |
              Select-Object -First 20 |
              ForEach-Object {
                [ordered]@{
                  id=$_.Id
                  provider=$_.ProviderName
                  message=$_.Message
                }
              }
          } catch {}

          [ordered]@{
            events=$events
            samples=$samples
            application_events=$appEvents
          } |
          ConvertTo-Json -Depth 8 |
          Out-File `
            "$env:GITHUB_WORKSPACE\\runtime.json" `
            -Encoding utf8

      - name: Help test
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Get-Content "$env:GITHUB_WORKSPACE\\exe.txt" | Select-Object -First 1).Substring(4)
          & $exe --help *> "$env:GITHUB_WORKSPACE\\help.txt"
          "exit=$LASTEXITCODE" | Add-Content "$env:GITHUB_WORKSPACE\\help.txt"

      - name: Version test
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Get-Content "$env:GITHUB_WORKSPACE\\exe.txt" | Select-Object -First 1).Substring(4)
          & $exe --version *> "$env:GITHUB_WORKSPACE\\version.txt"
          "exit=$LASTEXITCODE" | Add-Content "$env:GITHUB_WORKSPACE\\version.txt"

      - name: Installer and uninstaller discovery
        shell: pwsh
        continue-on-error: true
        run: |
          $root = "$env:RUNNER_TEMP\\gdb220"

          $installers = Get-ChildItem `
            $root `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension.ToLower() -in @(
                ".msi",
                ".msix",
                ".appx",
                ".appxbundle",
                ".msixbundle"
              ) -or
              $_.Name -match "(?i)(setup|installer|install)"
            } |
            Select-Object FullName,Length

          $uninstallers = Get-ChildItem `
            $root `
            -Recurse `
            -File |
            Where-Object {
              $_.Name -match "(?i)(uninstall|uninstaller|remove)"
            } |
            Select-Object FullName,Length

          [ordered]@{
            installers=$installers
            uninstallers=$uninstallers
          } |
          ConvertTo-Json -Depth 8 |
          Out-File `
            "$env:GITHUB_WORKSPACE\\installers.json" `
            -Encoding utf8

      - name: Windows environment
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Out-File `
              "$env:GITHUB_WORKSPACE\\environment.txt"

          Get-Process |
            Sort-Object CPU -Descending |
            Select-Object -First 50 |
            Out-File `
              "$env:GITHUB_WORKSPACE\\processes.txt"

      - name: Package evidence
        shell: pwsh
        if: always()
        run: |
          $out = "$env:GITHUB_WORKSPACE\\GDB220_WINDOWS_EVIDENCE"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out | Out-Null

          Copy-Item `
            "$env:GITHUB_WORKSPACE\\*.txt" `
            $out `
            -ErrorAction SilentlyContinue

          Copy-Item `
            "$env:GITHUB_WORKSPACE\\*.json" `
            $out `
            -ErrorAction SilentlyContinue

          Copy-Item `
            "$env:GITHUB_WORKSPACE\\*.txt" `
            $out `
            -ErrorAction SilentlyContinue

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GDB220-Windows-Evidence
          path: GDB220_WINDOWS_EVIDENCE
          if-no-files-found: warn
